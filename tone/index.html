<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Tuning Tone</title>
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/windows-ui.css">
    <link rel="stylesheet" href="../css/winui-icons.css">
    <link rel="stylesheet" href="../css/tool.css">
    <link rel="stylesheet" href="./css/custom.css">
  </head>
  <body class="tool">
    <div class="tool-bar">
      <div class="tool-field is-tight">
        <span>Reference pitch for A4, in hertz</span>
        <input class="app-input-text" id="REFERENCE" type="number" min="380" max="500" step="0.1" value="440" aria-label="Reference pitch for A4 in hertz">
      </div>
      <div class="tool-field is-wide-select">
        <span id="WAVE-LABEL">Waveform</span>
        <div class="app-select-menu">
          <select id="WAVE" aria-labelledby="WAVE-LABEL">
            <option value="sine">Sine</option>
            <option value="triangle">Triangle</option>
            <option value="square">Square</option>
            <option value="sawtooth">Sawtooth</option>
          </select>
        </div>
      </div>
      <div class="tool-field is-tight">
        <span>Octave</span>
        <input class="app-input-text" id="OCTAVE" type="number" min="1" max="7" step="1" value="4" aria-label="Octave">
      </div>
      <div class="tool-field is-tight">
        <span>Volume</span>
        <input id="VOLUME" type="range" min="0" max="1" step="0.05" value="0.4" aria-label="Volume">
      </div>
      <div class="tool-row is-end">
        <button class="app-btn" type="button" id="STOP">Stop</button>
      </div>
    </div>
    <div class="tool-stage is-stacked">
      <p class="tone-readout tool-readout" id="READOUT">-</p>
      <div class="tone-keys" id="KEYS"></div>
      <p class="tool-note" id="STATUS"></p>
    </div>
    <script src="../js/tool-state.js"></script>
    <script src="../js/click.js"></script>
    <script src="./js/script.js"></script>
  </body>
</html>
