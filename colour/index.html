<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Colour Wheel</title>
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/windows-ui.css">
    <link rel="stylesheet" href="../css/winui-icons.css">
    <link rel="stylesheet" href="../css/tool.css">
    <link rel="stylesheet" href="./css/custom.css">
  </head>
  <body class="tool">
    <div class="tool-bar">
      <div class="tool-row">
        <div class="tool-switch" role="group" aria-label="Choose the colour model">
          <button class="app-btn" type="button" id="MODEL-RYB" aria-pressed="true">RYB</button>
          <button class="app-btn" type="button" id="MODEL-RGB" aria-pressed="false">RGB and HSL</button>
        </div>
      </div>
      <div class="tool-field is-wide-select">
        <span id="SCHEME-LABEL">Harmony</span>
        <div class="app-select-menu">
          <select id="SCHEME" aria-labelledby="SCHEME-LABEL">
            <option value="none">Single colour</option>
            <option value="complementary">Complementary</option>
            <option value="analogous">Analogous</option>
            <option value="triadic">Triadic</option>
            <option value="tetradic">Tetradic</option>
            <option value="split">Split complementary</option>
          </select>
        </div>
      </div>
      <div class="tool-field is-tight">
        <span>Lightness</span>
        <input id="LIGHT" type="range" min="15" max="85" step="1" value="50" aria-label="Lightness">
      </div>
      <div class="tool-field is-tight">
        <span>Saturation</span>
        <input id="SAT" type="range" min="10" max="100" step="1" value="80" aria-label="Saturation">
      </div>
      <div class="tool-row wos-docs" data-kind="colour"></div>
    </div>
    <div class="colour-layout">
      <div class="colour-wheel-wrap">
        <svg class="colour-wheel" id="WHEEL" viewBox="0 0 220 220" role="img" aria-label="Colour wheel"></svg>
      </div>
      <section class="colour-side" aria-label="Chosen colours">
        <div class="colour-swatches" id="SWATCHES" aria-live="polite"></div>
        <h2 class="colour-subhead">Mixing two colours</h2>
        <div class="tool-row colour-mixers">
          <label class="tool-field is-tight" for="MIX-A"><span>First</span><input class="app-input-text" id="MIX-A" type="text" value="#d62828"></label>
          <label class="tool-field is-tight" for="MIX-B"><span>Second</span><input class="app-input-text" id="MIX-B" type="text" value="#0353a4"></label>
          <label class="tool-field is-tight" for="MIX-RATIO"><span>Proportion</span><input id="MIX-RATIO" type="range" min="0" max="1" step="0.05" value="0.5"></label>
        </div>
        <div class="colour-mix-result" id="MIX-RESULT"></div>
        <p class="tool-note" id="MIX-NOTE"></p>
      </section>
    </div>
    <script src="../js/wos-fs.js"></script>
    <script src="../js/formats.js"></script>
    <script src="../js/tool-state.js"></script>
    <script src="../js/click.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/tool-docs.js" defer></script>
    <script src="./js/script.js"></script>
  </body>
</html>
