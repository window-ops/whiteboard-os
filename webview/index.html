<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Web View</title>
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/windows-ui.css">
    <link rel="stylesheet" href="../css/winui-icons.css">
    <link rel="stylesheet" href="../css/tool.css">
    <link rel="stylesheet" href="./css/custom.css">
  </head>
  <body class="tool">
    <div class="tool-bar">
      <div class="tool-field is-wide">
        <span>Address</span>
        <input class="app-input-text" id="URLBAR" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Type the address you want to present..." aria-label="Address">
      </div>
      <div class="tool-row">
        <button class="app-btn app-btn-primary" type="button" id="NAVIGATE">Go</button>
        <button class="app-btn" type="button" id="OPEN-TAB">Open in a new tab</button>
      </div>
      <div class="tool-row wos-docs" data-kind="webview"></div>
    </div>
    <div class="webview-banner" id="BANNER" role="status" hidden>
      <span id="BANNER-TEXT"></span>
      <button class="app-btn app-btn-subtle" type="button" id="DISMISS">Dismiss</button>
    </div>
    <div class="tool-stage is-fitted">
      <iframe class="webview-frame" id="FRAME" title="Presented website" src="about:blank"></iframe>
    </div>
    <script src="../js/wos-fs.js"></script>
    <script src="../js/formats.js"></script>
    <script src="../js/tool-state.js"></script>
    <script src="../js/click.js"></script>
    <script src="../js/storage.js"></script>
    <script src="./js/functions.js"></script>
    <script src="../js/tool-docs.js" defer></script>
  </body>
</html>
