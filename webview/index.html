<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Web View</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="./js/functions.js"></script>
  </head>
  <body>
    <div class="toolbar-webview">
      <div class="url-container-webview">
        <div>
          <input type="text" id="URLBAR" placeholder="Type the URL you want to present...">
          <button onclick="Navigate()">Navigate</button>
        </div>
      </div>
    </div>
    <div class="program-body-webview">
      <div class="frame-container-webview">
        <iframe class="program-frame-webview" src="" id="FRAME"></iframe>
      </div>
    </div>
  </body>
</html>
