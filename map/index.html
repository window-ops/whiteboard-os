<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Map</title>
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/windows-ui.css">
    <link rel="stylesheet" href="../css/winui-icons.css">
    <link rel="stylesheet" href="../css/tool.css">
    <link rel="stylesheet" href="./leaflet/leaflet.css">
    <link rel="stylesheet" href="./css/custom.css">
  </head>
  <body class="tool">
    <div class="tool-bar">
      <div class="tool-row wos-docs" data-kind="map"></div>
      <div class="tool-row is-end">
        <button class="app-btn" type="button" id="MEASURE" aria-pressed="false">Measure distance</button>
        <button class="app-btn" type="button" id="RESET">Clear measurement</button>
        <span class="tool-note" id="READOUT"></span>
      </div>
    </div>
    <div class="tool-stage is-fitted">
      <div id="map"></div>
    </div>
    <script src="./leaflet/leaflet.js"></script>
    <script src="../js/wos-fs.js"></script>
    <script src="../js/formats.js"></script>
    <script src="../js/tool-state.js"></script>
    <script src="../js/click.js"></script>
    <script src="../js/storage.js"></script>
    <script src="./js/script.js"></script>
    <script src="../js/tool-docs.js" defer></script>
  </body>
</html>
